name: Backup diario

on:
  schedule:
    - cron: '0 5 * * *'   # 2 AM en Argentina (UTC-3)
  workflow_dispatch:       # permite dispararlo a mano

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        run: npm install -g supabase

      - name: Dump de la base
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          FECHA=$(date +%Y%m%d)
          supabase db dump \
            --db-url "${{ secrets.SUPABASE_DB_URL }}" \
            -f backup_$FECHA.sql
          gzip backup_$FECHA.sql

      - name: Subir a Storage
        run: |
          FECHA=$(date +%Y%m%d)
          curl -X POST \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/backups/backup_$FECHA.sql.gz" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@backup_$FECHA.sql.gz"